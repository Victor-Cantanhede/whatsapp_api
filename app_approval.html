<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp API App Review Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --wa-green: #00a884;
            --wa-green-dark: #008f6f;
            --wa-bg-app: #e0e4e7;
            --wa-bg-panel: #ffffff;
            --wa-text-primary: #111b21;
            --wa-text-secondary: #667781;
            --wa-border: #e9edef;
            --wa-header-bg: #f0f2f5;
            --wa-chat-bg: #efeae2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--wa-bg-app);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Top green background stripe typical of WhatsApp Web */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 127px;
            background-color: var(--wa-green);
            z-index: -1;
        }

        .app-container {
            width: 100%;
            max-width: 1600px;
            height: 100%;
            background-color: var(--wa-bg-panel);
            display: flex;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
        }

        @media (min-width: 1440px) {
            .app-container {
                height: calc(100vh - 40px);
                width: calc(100vw - 40px);
                border-radius: 8px;
                overflow: hidden;
            }
        }

        /* Sidebar Styles */
        .sidebar {
            width: 35%;
            max-width: 420px;
            min-width: 300px;
            background-color: #ffffff;
            border-right: 1px solid var(--wa-border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            background-color: var(--wa-header-bg);
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid var(--wa-border);
        }

        .sidebar-header h2 {
            font-size: 16px;
            color: var(--wa-text-primary);
            font-weight: 600;
            margin-left: 10px;
        }

        .menu-list {
            flex: 1;
            overflow-y: auto;
            background-color: #ffffff;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            transition: background-color 0.2s;
            border-bottom: 1px solid #f5f6f6;
        }

        .menu-item:hover {
            background-color: var(--wa-header-bg);
        }

        .menu-item.active {
            background-color: var(--wa-header-bg);
        }

        .menu-item-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--wa-green);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            color: white;
            flex-shrink: 0;
        }

        .menu-item:nth-child(2) .menu-item-icon {
            background-color: #53bdeb;
            /* Blue for templates */
        }

        .menu-item-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .menu-item-content h3 {
            font-size: 17px;
            color: var(--wa-text-primary);
            font-weight: 400;
            margin-bottom: 3px;
        }

        .menu-item-content p {
            font-size: 13px;
            color: var(--wa-text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Main Content Styles */
        .main-content {
            flex: 1;
            background-color: var(--wa-chat-bg);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .main-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            /* Subtle doodle background */
            background-image: url('data:image/svg+xml,%3Csvg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"%3E%3Cpath d="M20 20.5V18H0v-2h20v-2h2v2h18v2H22v2.5h18v2H22v2h-2v-2H0v-2h20z" fill="%23000000" fill-opacity="0.04" fill-rule="evenodd"/%3E%3C/svg%3E');
            opacity: 0.8;
            z-index: 0;
        }

        .view-header {
            background-color: var(--wa-header-bg);
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid var(--wa-border);
            z-index: 1;
        }

        .view-header h3 {
            font-size: 16px;
            color: var(--wa-text-primary);
            font-weight: 500;
        }

        .view-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .view {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }

        .view.active {
            display: flex;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-container {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(11, 20, 26, .08);
            padding: 24px;
            width: 100%;
            max-width: 650px;
        }

        .form-title {
            margin-bottom: 16px;
            color: var(--wa-text-primary);
            font-size: 20px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
            color: var(--wa-text-secondary);
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--wa-border);
            border-radius: 8px;
            font-size: 15px;
            color: var(--wa-text-primary);
            transition: all 0.2s;
            background-color: #f0f2f5;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--wa-green);
            background-color: #ffffff;
            box-shadow: 0 0 0 2px rgba(0, 168, 132, 0.2);
        }

        .form-control::placeholder {
            color: #8696a0;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        .btn-primary {
            background-color: var(--wa-green);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 24px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: auto;
            min-width: 160px;
        }

        .btn-primary:hover {
            background-color: var(--wa-green-dark);
            box-shadow: 0 4px 12px rgba(0, 168, 132, 0.2);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .response-container {
            margin-top: 24px;
            padding: 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            word-break: break-all;
        }

        .response-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .response-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .placeholder-box {
            border: 2px dashed #cbd5e1;
            background-color: #f8fafc;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            color: #64748b;
        }
    </style>
</head>

<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <svg viewBox="0 0 33 33" width="33" height="33" class="">
                    <path
                        d="M16.6 33C7.4 33 0 25.6 0 16.5S7.4 0 16.6 0 33 7.4 33 16.5 25.6 33 16.6 33zm0-30.8C8.7 2.2 2.2 8.6 2.2 16.5S8.7 30.8 16.6 30.8 31 24.4 31 16.5 24.5 2.2 16.6 2.2zM23.9 22.8c-.3.8-1.5 1.5-2.2 1.6h-.2c-.3 0-1 .1-3.2-.8-2.6-1.1-4.3-3.8-4.4-3.9-.1-.2-1.1-1.4-1.1-2.7s.7-1.9.9-2.1c.2-.2.5-.3.8-.3h.5c.2 0 .5-.1.7.5.3.7.9 2.2 1 2.4.1.2.1.4 0 .6s-.2.3-.3.5c-.2.2-.4.4-.5.6-.2.2-.4.4-.1.8.3.5.7 1.1 1.2 1.5.6.5 1.2.9 1.7 1.1.4.2.7.2.9 0 .2-.2.5-.6.7-.8.2-.2.4-.2.7-.1.3.1 1.9.9 2.2 1 .3.1.5.2.6.4.1.2.1.6-.2 1.4z"
                        fill="#00a884"></path>
                </svg>
                <h2>WhatsApp API</h2>
            </header>
            <div class="menu-list">
                <!-- Menu Item 1: Send Message -->
                <div class="menu-item active" data-target="send-message-view">
                    <div class="menu-item-icon">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                        </svg>
                    </div>
                    <div class="menu-item-content">
                        <h3>Send Message</h3>
                        <p>whatsapp_business_messaging</p>
                    </div>
                </div>

                <!-- Menu Item 2: Create Template -->
                <div class="menu-item" data-target="create-template-view">
                    <div class="menu-item-icon">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                            <path
                                d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z" />
                        </svg>
                    </div>
                    <div class="menu-item-content">
                        <h3>Create Template</h3>
                        <p>whatsapp_business_management</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Send Message View -->
            <div id="send-message-view" class="view active">
                <div class="view-header">
                    <h3>Send Message</h3>
                </div>
                <div class="view-body">
                    <div class="form-container">
                        <h2 class="form-title">Send WhatsApp Message</h2>
                        <form id="sendMessageForm">
                            <div class="form-group">
                                <label for="phone_number_id">Phone Number ID</label>
                                <input type="text" id="phone_number_id" name="phone_number_id" class="form-control"
                                    required placeholder="e.g. 102345678901234">
                            </div>

                            <div class="form-group">
                                <label for="token">System User Access Token</label>
                                <input type="password" id="token" name="token" class="form-control" required
                                    placeholder="EA... (Long lived token)">
                            </div>

                            <div class="form-group">
                                <label for="to">To (Recipient Number)</label>
                                <input type="text" id="to" name="to" class="form-control" required
                                    placeholder="e.g. 5511999999999 (with country code)">
                            </div>

                            <div class="form-group">
                                <label for="message">Message Text</label>
                                <textarea id="message" name="message" class="form-control" required
                                    placeholder="Type your message here to be delivered to the recipient..."></textarea>
                            </div>

                            <button type="submit" class="btn-primary" id="submitBtn">
                                <span>Send Message</span>
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                                </svg>
                            </button>
                        </form>

                        <div id="response-container" class="response-container"></div>
                    </div>
                </div>
            </div>

            <!-- Create Template View -->
            <div id="create-template-view" class="view">
                <div class="view-header">
                    <h3>Create Template</h3>
                </div>
                <div class="view-body">
                    <div class="form-container">
                        <h2 class="form-title">Message Template Management</h2>
                        <form id="createTemplateForm">
                            <div class="form-group">
                                <label for="waba_id">WhatsApp Business Account ID (WABA ID)</label>
                                <input type="text" id="waba_id" name="waba_id" class="form-control"
                                    required placeholder="e.g. 102345678901234">
                            </div>

                            <div class="form-group">
                                <label for="template_token">System User Access Token</label>
                                <input type="password" id="template_token" name="template_token" class="form-control" required
                                    placeholder="EA... (Long lived token)">
                            </div>

                            <div class="form-group">
                                <label for="template_name">Template Name</label>
                                <input type="text" id="template_name" name="template_name" class="form-control" required
                                    placeholder="e.g. promo_campaign_2026">
                            </div>

                            <div class="form-group">
                                <label for="template_category">Template Category</label>
                                <select id="template_category" name="template_category" class="form-control" required>
                                    <option value="MARKETING">MARKETING</option>
                                    <option value="UTILITY">UTILITY</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="template_message">Template Body Message</label>
                                <textarea id="template_message" name="template_message" class="form-control" required
                                    placeholder="Type your template body text here..."></textarea>
                            </div>

                            <button type="submit" class="btn-primary" id="submitTemplateBtn">
                                <span>Create Template</span>
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z" />
                                </svg>
                            </button>
                        </form>

                        <div id="template-response-container" class="response-container"></div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        // Tab switching logic
        const menuItems = document.querySelectorAll('.menu-item');
        const views = document.querySelectorAll('.view');

        menuItems.forEach(item => {
            item.addEventListener('click', () => {
                // Remove active class from all items and views
                menuItems.forEach(mi => mi.classList.remove('active'));
                views.forEach(v => v.classList.remove('active'));

                // Add active class to clicked item
                item.classList.add('active');

                // Show corresponding view
                const targetViewId = item.getAttribute('data-target');
                document.getElementById(targetViewId).classList.add('active');
            });
        });

        // Form Submission Logic for Meta API
        const form = document.getElementById('sendMessageForm');
        const responseContainer = document.getElementById('response-container');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Visual feedback
            const originalBtnHtml = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span>Sending...</span>';
            submitBtn.style.opacity = '0.8';
            submitBtn.disabled = true;
            responseContainer.style.display = 'none';
            responseContainer.className = 'response-container';
            responseContainer.innerHTML = '';

            // Gathering data
            const phoneNumberId = document.getElementById('phone_number_id').value.trim();
            const token = document.getElementById('token').value.trim();
            const to = document.getElementById('to').value.trim();
            const message = document.getElementById('message').value;

            const url = `https://graph.facebook.com/v25.0/${phoneNumberId}/messages`;

            const payload = {
                messaging_product: "whatsapp",
                recipient_type: "individual",
                to: to,
                type: "text",
                text: {
                    body: message
                }
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    responseContainer.className = 'response-container response-success';
                    responseContainer.innerHTML = `<strong>Success!</strong> Message sent.<br><small>Message ID: ${data.messages?.[0]?.id || 'N/A'}</small>`;
                } else {
                    responseContainer.className = 'response-container response-error';
                    responseContainer.innerHTML = `<strong>Error!</strong> Failed to send message.<br><pre style="white-space: pre-wrap; font-size: 12px; margin-top: 8px;">${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                responseContainer.className = 'response-container response-error';
                responseContainer.innerHTML = `<strong>Network Error!</strong><br><small>${error.message}</small>`;
            } finally {
                // Reset button
                submitBtn.innerHTML = originalBtnHtml;
                submitBtn.style.opacity = '1';
                submitBtn.disabled = false;
                responseContainer.style.display = 'block';
            }
        });

        // Form Submission Logic for Create Template API
        const templateForm = document.getElementById('createTemplateForm');
        const templateResponseContainer = document.getElementById('template-response-container');
        const submitTemplateBtn = document.getElementById('submitTemplateBtn');

        templateForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Visual feedback
            const originalBtnHtml = submitTemplateBtn.innerHTML;
            submitTemplateBtn.innerHTML = '<span>Creating...</span>';
            submitTemplateBtn.style.opacity = '0.8';
            submitTemplateBtn.disabled = true;
            templateResponseContainer.style.display = 'none';
            templateResponseContainer.className = 'response-container';
            templateResponseContainer.innerHTML = '';

            // Gathering data
            const wabaId = document.getElementById('waba_id').value.trim();
            const token = document.getElementById('template_token').value.trim();
            const name = document.getElementById('template_name').value.trim();
            const category = document.getElementById('template_category').value;
            const message = document.getElementById('template_message').value;

            const url = `https://graph.facebook.com/v25.0/${wabaId}/message_templates`;

            const payload = {
                name: name,
                language: "en",
                category: category,
                components: [
                    {
                        type: "BODY",
                        text: message
                    }
                ]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    templateResponseContainer.className = 'response-container response-success';
                    templateResponseContainer.innerHTML = `<strong>Success!</strong> Template created.<br><small>Template ID: ${data.id || 'N/A'}</small>`;
                } else {
                    templateResponseContainer.className = 'response-container response-error';
                    templateResponseContainer.innerHTML = `<strong>Error!</strong> Failed to create template.<br><pre style="white-space: pre-wrap; font-size: 12px; margin-top: 8px;">${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                templateResponseContainer.className = 'response-container response-error';
                templateResponseContainer.innerHTML = `<strong>Network Error!</strong><br><small>${error.message}</small>`;
            } finally {
                // Reset button
                submitTemplateBtn.innerHTML = originalBtnHtml;
                submitTemplateBtn.style.opacity = '1';
                submitTemplateBtn.disabled = false;
                templateResponseContainer.style.display = 'block';
            }
        });
    </script>
</body>

</html>
