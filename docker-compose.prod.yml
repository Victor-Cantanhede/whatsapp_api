# Stack de produção
# Subir com: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# O `up` aplica as migrations pelo serviço `migrate` antes de iniciar a API.
# Atenção: `restart api` NÃO reaplica migrations — para isso rode o `up -d` novamente.

name: whatsapp-api-prod

services:
    postgres:
        image: postgres:16
        container_name: whatsapp-api-db-prod
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: whatsapp_api
        ports:
            - '5434:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d whatsapp_api']
            interval: 10s
            retries: 5

    rabbitmq:
        image: rabbitmq:3-management
        container_name: whatsapp-api-rabbitmq-prod
        restart: always
        environment:
            RABBITMQ_DEFAULT_USER: whatsapp
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
        ports:
            - '127.0.0.1:15673:15672'
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq

    ffmpeg-api:
        build:
            context: ./docker/ffmpeg-api
        container_name: whatsapp-ffmpeg-api-prod
        restart: always

    migrate:
        build:
            context: .
            dockerfile: docker/api/Dockerfile
        image: whatsapp-api-prod
        container_name: whatsapp-api-migrate-prod
        restart: 'no'
        command: npx prisma migrate deploy
        environment:
            DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@whatsapp-api-db-prod:5432/whatsapp_api?schema=public
        depends_on:
            postgres:
                condition: service_healthy

    api:
        build:
            context: .
            dockerfile: docker/api/Dockerfile
        image: whatsapp-api-prod
        container_name: whatsapp-api-prod
        restart: always
        env_file:
            - .env.prod
        environment:
            NODE_ENV: production
            PORT: 5003
            DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@whatsapp-api-db-prod:5432/whatsapp_api?schema=public
            RABBITMQ_URL: amqp://whatsapp:${RABBITMQ_PASSWORD}@whatsapp-api-rabbitmq-prod:5672
            FFMPEG_API_URL: http://whatsapp-ffmpeg-api-prod:5004/convert
        networks:
            - default
            - traefik_public
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=traefik_public"
            - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-whatsapp_api}.rule=Host(`${WHATSAPP_API_DOMAIN}`)"
            - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-whatsapp_api}.entrypoints=websecure"
            - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-whatsapp_api}.tls=true"
            - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-whatsapp_api}.tls.certresolver=letsencrypt"
            - "traefik.http.services.${TRAEFIK_ROUTER_NAME:-whatsapp_api}.loadbalancer.server.port=${PORT:-5003}"
            - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-whatsapp_api}.middlewares=whatsapp-buffering"
            - "traefik.http.middlewares.whatsapp-buffering.buffering.maxRequestBodyBytes=104857600"
        depends_on:
            migrate:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_started
            ffmpeg-api:
                condition: service_started

networks:
    default:
        name: whatsapp_api_internal
    traefik_public:
        external: true

volumes:
    postgres_data:
    rabbitmq_data:
