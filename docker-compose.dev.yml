name: whatsapp-api-dev

services:
    postgres:
        image: postgres:16

        container_name: whatsapp-api-db

        restart: always

        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: whatsapp_api

        ports:
            - '5434:5432'

        volumes:
            - postgres_data:/var/lib/postgresql/data

    rabbitmq:
        image: rabbitmq:3-management
        container_name: whatsapp-api-rabbitmq
        restart: always
        environment:
            RABBITMQ_DEFAULT_USER: guest
            RABBITMQ_DEFAULT_PASS: guest
        ports:
            - '5675:5672'
            - '15675:15672'

    ffmpeg-api:
        build:
            context: ./docker/ffmpeg-api
        container_name: whatsapp-ffmpeg-api
        restart: always
        ports:
            - '5004:5004'

    web:
        build:
            context: .
            dockerfile: docker/web/Dockerfile
        container_name: whatsapp-web-dev
        restart: always
        ports:
            - '3003:3003'
        environment:
            - PORT=3003
            - NODE_ENV=development

volumes:
    postgres_data:
